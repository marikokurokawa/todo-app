<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todoリスト{% endblock %}</title>
  <style>
    :root { --main:#2f6fed; --bg:#f5f7fb; --card:#fff; --text:#222; --muted:#777; --danger:#d93838; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
           background:var(--bg); color:var(--text); }
    header { background:var(--main); color:#fff; padding:14px 16px; }
    header a { color:#fff; text-decoration:none; font-weight:bold; font-size:1.2rem; }
    main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
    .btn { display:inline-block; padding:8px 16px; border-radius:6px; border:none; cursor:pointer;
           background:var(--main); color:#fff; text-decoration:none; font-size:.95rem; }
    .btn.sub { background:#e3e8f2; color:var(--text); }
    .btn.danger { background:var(--danger); }
    .btn.small { padding:5px 10px; font-size:.85rem; }
    .flash { padding:10px 14px; border-radius:6px; margin-bottom:14px; }
    .flash.success { background:#e3f6e8; color:#1d6b33; }
    .flash.error { background:#fde8e8; color:#a12626; }
    .card { background:var(--card); border-radius:10px; padding:16px; margin-bottom:12px;
            box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .card.overdue { border-left:5px solid var(--danger); }
    .card h2 { margin:0 0 6px; font-size:1.1rem; word-break:break-word; }
    .content { white-space:pre-wrap; margin:6px 0 10px; word-break:break-word; }
    .meta { color:var(--muted); font-size:.85rem; }
    .due { font-weight:bold; }
    .overdue .due { color:var(--danger); }
    .actions { display:flex; gap:8px; margin-top:10px; }
    .actions form { margin:0; }
    label { display:block; font-weight:bold; margin:14px 0 6px; }
    input[type=text], input[type=date], textarea { width:100%; padding:10px; border:1px solid #ccd3e0;
           border-radius:6px; font-size:1rem; font-family:inherit; }
    textarea { min-height:120px; }
    .req { color:var(--danger); font-size:.8rem; margin-left:4px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .empty { text-align:center; color:var(--muted); padding:40px 0; }
    select { padding:9px 10px; border:1px solid #ccd3e0; border-radius:6px; font-size:1rem;
             font-family:inherit; background:#fff; }
    /* 絞り込みタブ */
    .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .tab { padding:6px 14px; border-radius:999px; background:#e3e8f2; color:var(--text);
           text-decoration:none; font-size:.9rem; }
    .tab.active { background:var(--main); color:#fff; }
    .sortbar { display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted); }
    .sortbar select { padding:5px 8px; font-size:.9rem; }
    /* 重要度バッジ */
    .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:.75rem;
             font-weight:bold; vertical-align:middle; margin-right:6px; }
    .badge.high { background:#fde8e8; color:#a12626; }
    .badge.medium { background:#fff4d6; color:#8a5a00; }
    .badge.low { background:#e3e8f2; color:#4a5568; }
    .card.priority-high { border-top:3px solid var(--danger); }
    /* 完了済み */
    .card.done { opacity:.6; }
    .card.done h2 .title-text { text-decoration:line-through; }
    .btn.done-btn { background:#1d8a45; }
    .btn.undo-btn { background:#e3e8f2; color:var(--text); }
    .section-label { color:var(--muted); font-size:.85rem; margin:22px 0 8px; }
    .radio-group { display:flex; gap:16px; }
    .radio-group label { display:flex; align-items:center; gap:6px; font-weight:normal; margin:0; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">📝 Todoリスト</a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
