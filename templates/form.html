{% extends "base.html" %}
{% block title %}{{ "やることを登録" if mode == "new" else "やることを編集" }} | Todoリスト{% endblock %}
{% block content %}
<h1>{{ "やることを登録" if mode == "new" else "やることを編集" }}</h1>

<form method="post" class="card">
  <label for="title">タイトル<span class="req">必須</span></label>
  <input type="text" id="title" name="title" maxlength="100" required value="{{ todo.title }}">

  <label for="content">内容</label>
  <textarea id="content" name="content">{{ todo.content }}</textarea>

  <label for="due_date">期日</label>
  <input type="date" id="due_date" name="due_date" value="{{ todo.due_date }}">

  <label>重要度</label>
  <div class="radio-group">
    {% for value, label in priorities.items() %}
      <label><input type="radio" name="priority" value="{{ value }}"
             {% if todo.priority == value %}checked{% endif %}> {{ label }}</label>
    {% endfor %}
  </div>

  <div class="actions" style="margin-top:20px;">
    <button class="btn" type="submit">{{ "登録する" if mode == "new" else "更新する" }}</button>
    <a class="btn sub" href="{{ url_for('index') }}">一覧に戻る</a>
  </div>
</form>
{% endblock %}
